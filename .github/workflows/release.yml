name: Android Signed Release

# Builds the signed release APK and publishes it as a GitHub Release.
#
# Run it from the Actions tab ("Run workflow") on main, or push a tag like
# v1.1.0. The version comes from app/build.gradle, so the tag is always
# v<versionName>.
#
# Needs these repository secrets (Settings > Secrets and variables > Actions):
#   RTR_KEYSTORE_BASE64    the release keystore, base64-encoded
#   RTR_KEYSTORE_PASSWORD  keystore password
#   RTR_KEY_ALIAS          key alias (road-to-riches)
#   RTR_KEY_PASSWORD       key password
# The keystore itself is never committed to git.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Read version
        id: ver
        run: echo "version=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.RTR_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.RTR_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.RTR_KEY_ALIAS }}
          KP: ${{ secrets.RTR_KEY_PASSWORD }}
        run: |
          missing=0
          [ -n "$KS" ]  || { echo "::error::Secret RTR_KEYSTORE_BASE64 is not set"; missing=1; }
          [ -n "$KSP" ] || { echo "::error::Secret RTR_KEYSTORE_PASSWORD is not set"; missing=1; }
          [ -n "$KA" ]  || { echo "::error::Secret RTR_KEY_ALIAS is not set"; missing=1; }
          [ -n "$KP" ]  || { echo "::error::Secret RTR_KEY_PASSWORD is not set"; missing=1; }
          exit $missing

      - name: Restore keystore
        env:
          KS: ${{ secrets.RTR_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APK
        env:
          RTR_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          RTR_KEYSTORE_PASSWORD: ${{ secrets.RTR_KEYSTORE_PASSWORD }}
          RTR_KEY_ALIAS: ${{ secrets.RTR_KEY_ALIAS }}
          RTR_KEY_PASSWORD: ${{ secrets.RTR_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: Rename APK and checksum
        run: |
          APK="WGRALGO-RoadToRiches-v${{ steps.ver.outputs.version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          cat "$APK.sha256"

      - name: Validate release APK
        run: bash tools/validate-release.sh "WGRALGO-RoadToRiches-v${{ steps.ver.outputs.version }}.apk"

      - name: Print signing certificate
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "WGRALGO-RoadToRiches-v${{ steps.ver.outputs.version }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Road to Riches v${{ steps.ver.outputs.version }}
          body_path: release-notes/v${{ steps.ver.outputs.version }}.md
          files: |
            WGRALGO-RoadToRiches-v${{ steps.ver.outputs.version }}.apk
            WGRALGO-RoadToRiches-v${{ steps.ver.outputs.version }}.apk.sha256

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: WGRALGO-RoadToRiches-v${{ steps.ver.outputs.version }}
          path: |
            WGRALGO-RoadToRiches-v${{ steps.ver.outputs.version }}.apk
            WGRALGO-RoadToRiches-v${{ steps.ver.outputs.version }}.apk.sha256
